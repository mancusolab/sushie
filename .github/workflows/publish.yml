name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install lint environment
        run: uv sync --frozen --extra dev

      - name: Python lint
        run: uv run ruff check sushie tests data

      - name: Python format
        run: uv run ruff format --check sushie tests data

      - name: Type check
        run: uv run ty check sushie tests data

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install test environment
        run: uv sync --frozen --extra dev

      - name: Run tests
        run: uv run pytest -p no:capture --cov sushie --cov-report term-missing

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  build:
    name: Build distribution
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # needed for hatch-vcs version detection

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Build package
        run: |
          rm -rf dist
          uv build

      - name: Install and smoke-test wheel
        shell: bash
        run: |
          uv venv smoke-venv --python 3.11
          uv pip install --python smoke-venv dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/smoke-venv/bin/python" - <<'PY'
          import sushie

          print(f"imported sushie from {sushie.__file__}")
          PY

      - name: Install and smoke-test sdist
        shell: bash
        run: |
          uv venv sdist-smoke-venv --python 3.11
          uv pip install --python sdist-smoke-venv dist/*.tar.gz
          cd /tmp
          "$GITHUB_WORKSPACE/sdist-smoke-venv/bin/python" - <<'PY'
          import sushie

          print(f"imported sushie from {sushie.__file__}")
          PY

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/*

      - name: Prune uv cache
        if: always()
        run: uv cache prune --ci

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sushie/
    permissions:
      contents: read
      id-token: write  # required for trusted publishing (OIDC)
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: testpypi
      url: https://test.pypi.org/project/sushie/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
