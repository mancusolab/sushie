[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "sushie"
dynamic = ["version"]
description = "SNP fine-mapping of molecular data across ancestries using SuShiE"
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Zeyun Lu", email = "zeyun_lu@dfci.harvard.edu" },
    { name = "Nicholas Mancuso", email = "Nicholas.Mancuso@med.usc.edu" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
]
requires-python = ">=3.11"
dependencies = [
    "jax",
    "jaxlib",
    "polars",
    "equinox",
    "scipy",
    "glimix-core",
    "genoio",
]

[project.optional-dependencies]
testing = [
    "setuptools",
    "pytest",
    "pytest-cov",
]
dev = [
    "pre-commit",
    "pymdown-extensions",
    "pytest-accept",
    "pytest-cov",
    "ruff>=0.0.243",
    "sphinx>=5",
    "sphinx-immaterial",
    "ty>=0.0.44",
]

[project.urls]
Homepage = "https://github.com/mancusolab/sushie"
Source = "https://github.com/mancusolab/sushie"
Tracker = "https://github.com/mancusolab/sushie/issues"

[project.scripts]
sushie = "sushie.cli:run_cli"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "sushie/_version.py"

[tool.hatch.build.targets.sdist]
exclude = ["tests/", "data/", "docs/", "misc/"]

[tool.hatch.build.targets.wheel]
packages = ["sushie"]

[tool.pytest.ini_options]
addopts = "--cov sushie --cov-report term-missing --verbose"
norecursedirs = ["dist", "build", ".tox"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I001", "UP"]
ignore = ["E402", "E721", "E731", "E741", "F722", "TID252"]

[tool.ruff.lint.isort]
known-first-party = ["sushie"]
combine-as-imports = true
lines-after-imports = 2
lines-between-types = 1
section-order = [
    "future",
    "standard-library",
    "third-party",
    "jax-ecosystem",
    "first-party",
    "local-folder",
]
order-by-type = false

[tool.ruff.lint.isort.sections]
jax-ecosystem = ["equinox", "jax", "jaxtyping"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["sushie", "tests", "data"]
