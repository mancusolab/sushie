[project]
site_name = "SuShiE"
site_url = "https://mancusolab.github.io/sushie/"
site_description = "SNP fine-mapping of molecular data across ancestries using SuShiE"
site_author = "MancusoLab"
copyright = "© 2026 MancusoLab"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = false
repo_url = "https://github.com/mancusolab/sushie"
repo_name = "mancusolab/sushie"
edit_uri = "edit/main/docs/"
extra_javascript = [
    "javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]
nav = [
    { "User Guide" = [
        { "Overview" = "readme.md" },
        { "Model" = "model.md" },
        { "Users Manual" = "manual.md" },
        { "Files" = "files.md" },
        { "FAQ" = "faq.md" },
    ] },
    { "API Reference" = [
        { "CLI" = "api/cli.md" },
        { "Infer" = "api/infer.md" },
        { "Summary-level Infer" = "api/infer-ss.md" },
        { "I/O" = "api/io.md" },
        { "Utils" = "api/utils.md" },
    ] },
    { "Development" = [
        { "Contributions & Help" = "contributing.md" },
        { "Code of Conduct" = "conduct.md" },
        { "Version History" = "version.md" },
        { "Authors" = "authors.md" },
        { "License" = "license.md" },
    ] },
]

[project.theme]
variant = "classic"
logo = "_static/images/dna.png"
favicon = "_static/images/favicon.ico"
font.text = "Roboto"
font.code = "Roboto Mono"
features = [
    "navigation.expand",
    "navigation.sections",
    "navigation.top",
    "toc.follow",
    "content.action.edit",
    "content.action.view",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/mancusolab/sushie"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/sushie/"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "cyan"
accent = "amber"
toggle.icon = "material/lightbulb-outline"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "cyan"
accent = "amber"
toggle.icon = "material/lightbulb"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.footnotes]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true
toc_depth = 3

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true

[project.markdown_extensions.pymdownx.superfences]

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
members_order = "source"
inherited_members = false
show_bases = false
show_source = true
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
merge_init_into_class = true

[project.validation]
invalid_links = true
invalid_link_anchors = true
